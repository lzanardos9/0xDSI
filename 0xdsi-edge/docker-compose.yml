version: "3.9"

services:
  oxdsi-edge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 0xdsi-edge
    restart: unless-stopped
    ports:
      - "9443:9443"   # Control plane / health
      - "514:514"     # Syslog TCP
      - "514:514/udp" # Syslog UDP
      - "6514:6514"   # Syslog TLS
      - "8088:8088"   # HEC receiver
      - "2055:2055/udp" # NetFlow/IPFIX
      - "162:162/udp" # SNMP Trap
    volumes:
      - ./config/config.toml:/etc/0xdsi-edge/config.toml:ro
      - edge-buffer:/var/lib/0xdsi-edge/buffer
      - ./plugins:/etc/0xdsi-edge/plugins:ro
    environment:
      - RUST_LOG=info
      - OXDSI_TENANT_ID=${OXDSI_TENANT_ID:-default}
    networks:
      - oxdsi-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "2.0"
        reservations:
          memory: 64M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9443/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional: local Kafka for development
  kafka:
    image: bitnami/kafka:3.7
    container_name: 0xdsi-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - kafka-data:/bitnami/kafka
    networks:
      - oxdsi-net
    profiles:
      - dev

volumes:
  edge-buffer:
  kafka-data:

networks:
  oxdsi-net:
    driver: bridge
