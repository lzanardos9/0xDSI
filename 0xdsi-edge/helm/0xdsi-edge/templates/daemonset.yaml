apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "oxdsi-edge.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "oxdsi-edge.name" . }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "oxdsi-edge.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "oxdsi-edge.name" . }}
    spec:
      containers:
        - name: edge
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 9443
              name: control
            - containerPort: 514
              name: syslog-tcp
              protocol: TCP
            - containerPort: 514
              name: syslog-udp
              protocol: UDP
            - containerPort: 6514
              name: syslog-tls
            - containerPort: 2055
              name: netflow
              protocol: UDP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/0xdsi-edge
              readOnly: true
            - name: buffer
              mountPath: /var/lib/0xdsi-edge/buffer
          livenessProbe:
            httpGet:
              path: /health
              port: control
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: control
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: {{ include "oxdsi-edge.fullname" . }}-config
        - name: buffer
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "oxdsi-edge.fullname" . }}-buffer
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
