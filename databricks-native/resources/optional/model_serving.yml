# Opt-in: not matched by the `resources/*.yml` include in databricks.yml.
# Enable only after the six models are registered in Unity Catalog
# (notebooks/setup/04_register_model_serving.py), by adding
# `resources/optional/model_serving.yml` to the include list and redeploying.
resources:
  model_serving_endpoints:
    ciso_assistant:
      name: "0xdsi-ciso-assistant"
      config:
        served_entities:
          - entity_name: "${var.catalog}.${var.schema}.0xdsi_ciso_assistant"
            entity_version: "1"
            workload_size: "Small"
            scale_to_zero_enabled: true
    sage_enrichment:
      name: "0xdsi-sage-enrichment"
      config:
        served_entities:
          - entity_name: "${var.catalog}.${var.schema}.0xdsi_sage_enrichment"
            entity_version: "1"
            workload_size: "Small"
            scale_to_zero_enabled: true
    nova_investigation:
      name: "0xdsi-nova-investigation"
      config:
        served_entities:
          - entity_name: "${var.catalog}.${var.schema}.0xdsi_nova_investigation"
            entity_version: "1"
            workload_size: "Small"
            scale_to_zero_enabled: true
    vanguard_response:
      name: "0xdsi-vanguard-response"
      config:
        served_entities:
          - entity_name: "${var.catalog}.${var.schema}.0xdsi_vanguard_response"
            entity_version: "1"
            workload_size: "Small"
            scale_to_zero_enabled: true
    threat_radar:
      name: "0xdsi-threat-radar"
      config:
        served_entities:
          - entity_name: "${var.catalog}.${var.schema}.0xdsi_threat_radar"
            entity_version: "1"
            workload_size: "Small"
            scale_to_zero_enabled: true
    threat_simulator:
      name: "0xdsi-threat-simulator"
      config:
        served_entities:
          - entity_name: "${var.catalog}.${var.schema}.0xdsi_threat_simulator"
            entity_version: "1"
            workload_size: "Small"
            scale_to_zero_enabled: true
